# Public site: draninavega.com
# (The admin portal is a separate Netlify project with base directory "admin"; see admin/netlify.toml.)

[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build when a commit only touches the admin portal or docs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)admin' ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "22"

# Spanish is the default at "/". Catch people typing /es.
[[redirects]]
  from = "/es"
  to = "/"
  status = 301
[[redirects]]
  from = "/es/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fingerprinted build assets and fonts never change: cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
